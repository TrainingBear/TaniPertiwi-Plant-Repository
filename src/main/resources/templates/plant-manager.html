<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TaniPertiwi Plant Manager</title>
    <link rel="stylesheet" href="/plant-manager.css">
</head>
<body>
<header>
    <div><p class="eyebrow">TANI PERTIWI</p>
        <h1>Plant manager</h1>
        <p class="subtle">Mari kita bangun demi indonesia emas.</p></div>
    <button id="newPlant" class="primary">+ Add plant</button>
</header>
<main>
    <aside><label class="search"><span>⌕</span><input id="search" placeholder="Search plants"></label>
        <p id="count" class="subtle"></p>
        <div id="plantList" class="plant-list"></div>
    </aside>
    <section id="empty" class="empty"><h2>Select a plant</h2>
        <p>Choose a plant from the list or create a new one.</p></section>
    <form id="editor" hidden>
        <div class="editor-top">
            <div><p class="eyebrow" id="mode">EDIT PLANT</p>
                <h2 id="title"></h2></div>
            <div class="actions">
                <button type="button" id="delete" class="danger">Remove</button>
                <button class="primary">Save changes</button>
            </div>
        </div>
        <p id="message" role="status"></p>
        <details open>
            <summary>Plant profile</summary>
            <div id="profile" class="fields"></div>
        </details>
        <details open>
            <summary>Plant care</summary>
            <div id="care" class="fields"></div>
        </details>
        <details>
            <summary>Product system</summary>
            <div id="product" class="fields"></div>
        </details>
        <details>
            <summary>EcoCrop metadata <span class="subtle">(all 55 fields)</span></summary>
            <div id="ecocrop" class="fields"></div>
        </details>
    </form>
</main>
<template id="field"><label><span></span><input></label></template>
<script src="/plant-manager.js"></script>
</body>
</html>
